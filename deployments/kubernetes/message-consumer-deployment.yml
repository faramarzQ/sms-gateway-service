apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-gateway-message-consumer
  namespace: sms-gateway
  labels:
    app: sms-gateway-message-consumer

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sms-gateway-message-consumer

  template:
    metadata:
      labels:
        app: sms-gateway-message-consumer

    spec:
      containers:
        - name: message-consumer
          image: sms-gateway-message-consumer:latest
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: sms-gateway-config
            - secretRef:
                name: sms-gateway-secret

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10