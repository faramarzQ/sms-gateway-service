apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-gateway-api
  namespace: sms-gateway
  labels:
    app: sms-gateway-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: sms-gateway-api

  template:
    metadata:
      labels:
        app: sms-gateway-api

    spec:
      containers:
        - name: api
          image: sms-gateway-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: sms-gateway-config

            - secretRef:
                name: sms-gateway-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10